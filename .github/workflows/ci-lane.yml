name: LS-918 main all-on comparison
on:
  push:
    branches: ['ci/171-LS-918-main-all-on-*']
permissions:
  contents: read
jobs:
  baseline:
    name: Main all switches on
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: node .github/all-switches-on/switches.js find
      - run: npx jest --ci --testMatch '<rootDir>/.github/all-switches-on/*.check.js'
      - run: npx tsc --noEmit
      - run: npm test --if-present -- --ci --passWithNoTests --json --outputFile="$RUNNER_TEMP/all-switches-on-jest.json"
      - if: always()
        run: node .github/all-switches-on/switches.js report "$RUNNER_TEMP/all-switches-on-jest.json"
